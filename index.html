<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0c12"><meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/static/icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/static/icon.svg">
<title>PinDown — Baixe vídeos</title>
<style>
:root{font-family:Inter,system-ui,Arial,sans-serif;color:#f7f7fb;background:#0b0c12}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#2c1730 0%,#0b0c12 60%);display:flex;align-items:center;justify-content:center;padding:24px}.wrap{width:min(100%,620px)}.logo{display:flex;align-items:center;justify-content:center;gap:12px;font-size:28px;font-weight:850;letter-spacing:-1px}.logo span{background:#e72d56;border-radius:14px;padding:10px 15px}h1{text-align:center;font-size:clamp(30px,6vw,46px);letter-spacing:-2px;line-height:1.1;margin:36px 0 14px}h1 em{color:#ff4b73;font-style:normal}p{text-align:center;color:#a7a6b5;line-height:1.6}.panel{margin-top:30px;background:#171821;border:1px solid #34303e;padding:26px;border-radius:22px;box-shadow:0 20px 65px #0005}label{display:block;font-size:14px;font-weight:700;margin-bottom:12px}.field{width:100%;padding:17px;background:#0e1017;color:white;border:1px solid #3b3b48;border-radius:12px;font-size:15px;outline:none}.field:focus{border-color:#f04b74}button{border:0;border-radius:12px;padding:16px 22px;background:#ee315d;color:white;font-weight:750;cursor:pointer;width:100%;margin-top:14px;font-size:16px}button:hover{background:#ff4b77}button:disabled{opacity:.6;cursor:wait}.status{min-height:25px;font-size:14px;color:#c9c4d0;margin-top:16px;text-align:center}.preview{display:none;margin-top:20px;gap:16px;align-items:center;background:#20212c;padding:14px;border-radius:14px}.preview img{width:110px;height:110px;object-fit:cover;border-radius:10px}.preview strong{display:block;overflow-wrap:anywhere}.preview small{color:#a8a5b5}footer{font-size:12px;color:#777584;text-align:center;margin-top:30px}.install{display:none;background:#292a37;border:1px solid #514657}.credit{color:#ff8aa3;font-weight:700}@media(max-width:480px){body{padding:18px 14px;align-items:flex-start}.wrap{margin:auto 0}.panel{padding:20px 16px;border-radius:18px}.preview img{width:82px;height:82px}.logo{font-size:25px}h1{margin-top:28px}.field{font-size:16px}}
</style>
</head>
<body><main class="wrap"><div class="logo"><span>↓</span> PinDown</div><h1>Seus vídeos favoritos,<br><em>em um clique.</em></h1><p>Baixe vídeos públicos do Pinterest, Instagram, YouTube e Facebook.</p><section class="panel"><label for="url">Link do vídeo</label><input class="field" id="url" type="url" inputmode="url" placeholder="Cole o link da publicação" autocomplete="url"><button id="analyze">Buscar vídeo →</button><button class="install" id="install">＋ Instalar PinDown</button><div class="status" id="status" role="status" aria-live="polite"></div><div class="preview" id="preview"><img id="thumb" alt="Miniatura do vídeo"><div style="flex:1;min-width:0"><strong id="title"></strong><small id="duration"></small><button id="download">↓ Baixar vídeo</button></div></div></section><footer>Uso pessoal • Baixe apenas conteúdos que você tem direito de utilizar.<br><span class="credit">by TK</span></footer></main>
<script>
const $=id=>document.getElementById(id), status=$('status'), preview=$('preview');
async function request(path){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:$('url').value.trim()})});if(!r.ok){let msg='Não foi possível processar este link.';try{msg=(await r.json()).detail||msg}catch{}throw Error(msg)}return r}
$('analyze').onclick=async()=>{preview.style.display='none';$('analyze').disabled=true;status.textContent='Buscando informações do vídeo...';try{const data=await(await request('/api/info')).json();$('title').textContent=data.title;$('thumb').style.display=data.thumbnail?'block':'none';if(data.thumbnail)$('thumb').src=data.thumbnail;$('duration').textContent=data.duration?`${Math.floor(data.duration/60)}:${String(Math.floor(data.duration%60)).padStart(2,'0')}`:'Vídeo disponível';preview.style.display='flex';status.textContent='Vídeo encontrado!'}catch(e){status.textContent=e.message}finally{$('analyze').disabled=false}};
$('download').onclick=async()=>{$('download').disabled=true;status.textContent='Preparando o download...';try{const r=await request('/api/download');const blob=await r.blob();const disposition=r.headers.get('content-disposition')||'';const match=disposition.match(/filename\*?=(?:UTF-8''|\")?([^;\"]+)/i);const name=match?decodeURIComponent(match[1]):'pindown-video.mp4';const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),30000);status.textContent='Download iniciado!'}catch(e){status.textContent=e.message}finally{$('download').disabled=false}};
$('url').addEventListener('keydown',e=>{if(e.key==='Enter')$('analyze').click()});
let installPrompt;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;$('install').style.display='block'});$('install').onclick=async()=>{if(!installPrompt)return;await installPrompt.prompt();installPrompt=null;$('install').style.display='none'};
const sharedParams=new URLSearchParams(location.search);let sharedUrl=sharedParams.get('url')||'';if(!sharedUrl){const sharedText=sharedParams.get('text')||'';sharedUrl=(sharedText.match(/https?:\/\/[^\s<>"']+/i)||[])[0]||'';sharedUrl=sharedUrl.replace(/[),.;!?]+$/,'')}if(sharedUrl){$('url').value=sharedUrl;history.replaceState(null,'',location.pathname);$('analyze').click()}
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js'));
</script></body></html>
